[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiplexed-interactive-agent-sdk-demo-python"
version = "0.0.0.dev0"
description = "Interactive external SDK consumer demo for the Deterministic AI Runtime."
requires-python = ">=3.10"
dependencies = [
    "multiplexed-ai-sdk==0.0.0.dev0",
]

[tool.setuptools.packages.find]
where = ["src"]
